name: Android signed candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/signed-build-request.txt'

permissions:
  contents: read
  actions: read
concurrency:
  group: bestshot-android-signed-candidate
  cancel-in-progress: false
jobs:
  sign:
    environment: bestshot-android-signing
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify exact-main CI before signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$head" = "$main" || { echo "::error::main moved"; exit 1; }
          for attempt in $(seq 1 60); do
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            test "$current" = "$head" || { echo "::error::main advanced"; exit 1; }
            all_good=true
            for workflow in android.yml macos.yml; do
              result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                --branch main --limit 30 --json headSha,conclusion \
                --jq ".[] | select(.headSha == \"$head\") | .conclusion" | head -n 1)"
              if [[ "$result" == success ]]; then
                continue
              fi
              if [[ "$result" == failure || "$result" == cancelled || "$result" == timed_out ]]; then
                echo "::error::$workflow failed exact-main CI"; exit 1
              fi
              all_good=false
            done
            if [[ "$all_good" == true ]]; then
              echo "Exact-main Android and macOS CI PASS ($head)"
              exit 0
            fi
            echo "Awaiting exact-main checks ($attempt/60)"
            sleep 15
          done
          echo "::error::Timed out waiting for exact-main CI"; exit 1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
      - name: Android SDK 37.0
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          min-wrapper-count: '1'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: true
      - name: Sign, verify, and discard temporary keystore
        shell: bash
        env:
          KEYSTORE_BASE64: '${{ secrets.BESTSHOT_ANDROID_KEYSTORE_BASE64 }}'
          STORE_PASSWORD_SECRET: '${{ secrets.BESTSHOT_ANDROID_STORE_PASSWORD }}'
          KEY_ALIAS_SECRET: '${{ secrets.BESTSHOT_ANDROID_KEY_ALIAS }}'
          KEY_PASSWORD_SECRET: '${{ secrets.BESTSHOT_ANDROID_KEY_PASSWORD }}'
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD_SECRET" || -z "$KEY_ALIAS_SECRET" || -z "$KEY_PASSWORD_SECRET" ]]; then
            echo "::error::One or more Android signing secrets are missing"
            exit 1
          fi
          key_directory="$(mktemp -d "$RUNNER_TEMP/bestshot-key-XXXXXXXX")"
          trap 'rm -rf "$key_directory"' EXIT
          export BESTSHOT_SIGNING_STORE_FILE="$key_directory/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$BESTSHOT_SIGNING_STORE_FILE"
          test -s "$BESTSHOT_SIGNING_STORE_FILE"
          chmod 600 "$BESTSHOT_SIGNING_STORE_FILE"
          export BESTSHOT_SIGNING_STORE_PASSWORD="$STORE_PASSWORD_SECRET"
          export BESTSHOT_SIGNING_KEY_ALIAS="$KEY_ALIAS_SECRET"
          export BESTSHOT_SIGNING_KEY_PASSWORD="$KEY_PASSWORD_SECRET"
          (cd android && ./gradlew --no-daemon --console=plain :app:bundleRelease :app:assembleRelease)
          aab='android/app/build/outputs/bundle/release/app-release.aab'
          apk='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$aab" && test -s "$apk"
          jarsigner -verify -verbose "$aab" > "$RUNNER_TEMP/aab-verification.txt"
          grep -q 'jar verified.' "$RUNNER_TEMP/aab-verification.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk" \
            > "$RUNNER_TEMP/apk-verification.txt"
          (
            cd android/app/build/outputs
            sha256sum bundle/release/app-release.aab apk/release/app-release.apk > SIGNED-SHA256SUMS.txt
          )
      - name: Store signed candidate artifacts for 7 days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bestshot-android-signed-${{ github.sha }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/SIGNED-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate signing PowerShell script syntax (no secrets)
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/Upload-BestShotSigningSecrets.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Set up JDK 25 LTS
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Validate official Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          min-wrapper-count: '1'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: true
      - name: Verify Gradle toolchain
        run: |
          java -version
          (cd android && ./gradlew --version)
      - name: Compile, test, lint and bundle
        run: |
          cd android
          ./gradlew --no-daemon \
            :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:bundleRelease
      - name: Verify release and privacy
        run: |
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
          test -n "$APK"
          test -n "$(find android/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" > "$RUNNER_TEMP/permissions.txt"
          ! grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"
          ! grep -q 'android.permission.READ_MEDIA_IMAGES' "$RUNNER_TEMP/permissions.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "sdkVersion:'29'"
      - name: Upload Android debug APK and unsigned release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BestShot-Android-testing
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Smoke-test release signing with disposable CI-only key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          temp="$(mktemp -d "$RUNNER_TEMP/bestshot-ci-signing-XXXXXXXX")"
          trap 'rm -rf "$temp"' EXIT
          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 1 \
            -alias ci-only -dname 'CN=BestShot Ephemeral CI' \
            -keystore "$temp/ci.jks" \
            -storepass 'BestShotSmokeOnly123' -keypass 'BestShotSmokeOnly123'
          export BESTSHOT_SIGNING_STORE_FILE="$temp/ci.jks"
          export BESTSHOT_SIGNING_STORE_PASSWORD='BestShotSmokeOnly123'
          export BESTSHOT_SIGNING_KEY_ALIAS='ci-only'
          export BESTSHOT_SIGNING_KEY_PASSWORD='BestShotSmokeOnly123'
          (cd android && ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease)
          apk='android/app/build/outputs/apk/release/app-release.apk'
          aab='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$apk" && test -s "$aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          jarsigner -verify "$aab" > "$temp/aab-check.txt"
          grep -Fq 'jar verified' "$temp/aab-check.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
            grep -Fq "name='com.sl.bestshot'"
          # Disposable CI-signed files are never uploaded as artifacts.
